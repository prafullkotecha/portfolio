name = "ai-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Set this in Cloudflare dashboard → Workers → ai-proxy → Settings → Variables → Environment Variables
# Then `wrangler secret put GEMINI_API_KEY`, etc.

[vars]
ALLOWED_ORIGINS = "https://yourdomain.com,https://*.yourdomain.com,https://*.pages.dev"

# Optional: bind to your domain
# [routes]
# pattern = "ai.yourdomain.com/*"
# zone_name = "yourdomain.com"
